<div class="p-2">
    <app-contacts-form></app-contacts-form>
    <h2>Contacts</h2>
    @if(contacts().length == 0) {
    No contacts yet
    }
    <ul>
        @for(contact of contacts(); track contact.id) {
        <li>
            {{contact.name}}, {{contact.company}}
        </li>
        <button (click)="contactsService.delete(contact.id)">
            delete
        </button>
        <button (click)="selectedContact = contact.id;">
            detail
        </button>
        }
    </ul>
</div>

@if(selectedContact) {

<app-contact-detail (onClose)="selectedContact = undefined;" [contactId]="selectedContact!"></app-contact-detail>
}
